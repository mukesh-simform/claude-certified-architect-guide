name: Site bug
description: Broken link, layout problem, quiz or mock not working
labels: [bug]
body:
  - type: input
    id: page
    attributes:
      label: Page
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened and what you expected
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Browser, device and theme
      placeholder: Safari on iPhone 15, dark mode
